[package]
name = "libmtg-forge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Mystic Forge experiment harness for libmtg: deterministic A/B opening-hand tests and full-match scaffolding."

[lib]
name = "libmtg_forge"
path = "src/lib.rs"

[[bin]]
name = "forge-lab"
path = "src/main.rs"

[dependencies]
libmtg-engine = { path = "../../crates/libmtg-engine" }
libmtg-decklist = { path = "../../crates/libmtg-decklist" }
clap = { version = "4.5", features = ["derive"] }
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", features = ["json"] }
